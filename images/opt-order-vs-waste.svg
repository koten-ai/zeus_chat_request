<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title desc">
  <title id="title">Optimization is shrinking an evidence bag to ORDER, not more work</title>
  <desc id="desc">Left: a question shrinks 400 to 120 to 12 to 5 bound ids and lands ORDER. Right: the same question fans out into independent List hotel, List airport, List landmark hops — more sub-agents and rows, not faster.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke-width: 2.5; }
      .h { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .q { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .n { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .cap { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .okT { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #166534; }
      .badT { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9f1239; }
      .foot { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0891b2"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e11d48"/></marker>
  </defs>
  <rect class="bg" width="1240" height="640"/>
  <text class="title" x="620" y="42" text-anchor="middle">What optimization is</text>
  <text class="sub" x="620" y="70" text-anchor="middle">Reach ORDER by touching as little of the graph as possible — in as few AI rounds as possible.</text>

  <!-- WIN -->
  <rect class="panel" x="40" y="96" width="560" height="460" rx="18" stroke="#16a34a"/>
  <text class="h" x="320" y="132" text-anchor="middle" fill="#166534">Win · shrink one bag</text>
  <rect x="120" y="156" width="400" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="q" x="320" y="182" text-anchor="middle">“beach / Mexico / fun / April / ≤ $300”</text>

  <circle cx="320" cy="248" r="48" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
  <text class="n" x="320" y="244" text-anchor="middle">400</text>
  <text class="cap" x="320" y="262" text-anchor="middle">search place</text>
  <path d="M320 296 L320 318" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a1)"/>
  <circle cx="320" cy="360" r="36" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text class="n" x="320" y="356" text-anchor="middle">120</text>
  <text class="cap" x="320" y="374" text-anchor="middle">narrow_to vibe</text>
  <path d="M320 396 L320 416" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a1)"/>
  <circle cx="320" cy="448" r="24" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/>
  <text class="n" x="320" y="454" text-anchor="middle" font-size="14">12</text>
  <path d="M352 448 L400 448" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a1)"/>
  <rect x="408" y="428" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="okT" x="483" y="454" text-anchor="middle">ORDER · 5 rows</text>
  <text class="cap" x="320" y="530" text-anchor="middle">one AI round · @step.ids · staple fast_pass or thorough</text>

  <!-- WASTE -->
  <rect class="panel" x="640" y="96" width="560" height="460" rx="18" stroke="#e11d48"/>
  <text class="h" x="920" y="132" text-anchor="middle" fill="#9f1239">Waste · more Lists, more agents</text>
  <rect x="720" y="156" width="400" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="q" x="920" y="182" text-anchor="middle">same question</text>

  <rect x="680" y="230" width="150" height="70" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="badT" x="755" y="260" text-anchor="middle">List hotel</text>
  <text class="cap" x="755" y="280" text-anchor="middle">new global bag</text>
  <rect x="865" y="230" width="150" height="70" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="badT" x="940" y="260" text-anchor="middle">List airport</text>
  <text class="cap" x="940" y="280" text-anchor="middle">new global bag</text>
  <rect x="1050" y="230" width="130" height="70" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text class="badT" x="1115" y="260" text-anchor="middle">List landmark</text>
  <text class="cap" x="1115" y="280" text-anchor="middle">new global bag</text>

  <path d="M755 300 L755 360" stroke="#e11d48" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M940 300 L940 360" stroke="#e11d48" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M1115 300 L1115 360" stroke="#e11d48" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="720" y="368" width="400" height="56" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text class="badT" x="920" y="392" text-anchor="middle">many Sessions 200s · no shared @ids</text>
  <text class="cap" x="920" y="412" text-anchor="middle">looks busy · misses ORDER</text>
  <text class="cap" x="920" y="530" text-anchor="middle">more sub-agents / more rows  ≠  faster</text>

  <text class="foot" x="620" y="596" text-anchor="middle">A cheap table the SLA asked for is a win. A cheap table that still needs another chat is a miss — unless SLA says progressive disclosure.</text>
</svg>
