<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">How to pick a staple, and the two clocks of optimization</title>
  <desc id="desc">Left: out-of-corpus wish; else class plus SLA and complexity pick fast_pass, scout, or thorough. Right: per-turn staple versus hot-path graduation from a pipeline template to a named_query rail. named_query is HTTP today, not a pin verb. Pathshape must count unbound retrievals, not step count.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .h { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .p { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lab { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    </style>
    <marker id="k" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1240" height="760"/>
  <text class="title" x="620" y="40" text-anchor="middle">Picking a staple · two clocks</text>
  <text class="sub" x="620" y="66" text-anchor="middle">SLA × complexity are operator inputs to invent — not engine fields today. A/B still uses HTTP OK minus empty.</text>

  <!-- LEFT: pick -->
  <rect x="36" y="88" width="580" height="640" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="326" y="122" text-anchor="middle">Per turn · pick a staple</text>

  <rect x="86" y="144" width="480" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="lab" x="326" y="170" text-anchor="middle">question + MINI-SCHEMA</text>
  <path d="M326 184 L326 206" stroke="#64748b" stroke-width="2" marker-end="url(#k)"/>

  <rect x="86" y="210" width="480" height="48" rx="8" fill="#fff1f2" stroke="#e11d48"/>
  <text class="lab" x="326" y="232" text-anchor="middle">Out of this overlay?</text>
  <text class="tiny" x="326" y="250" text-anchor="middle">“Why Rome fell” on hotels → wish / clarify</text>
  <path d="M326 258 L326 280" stroke="#64748b" stroke-width="2" marker-end="url(#k)"/>

  <rect x="86" y="284" width="220" height="70" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text class="lab" x="196" y="314" text-anchor="middle">known_goal</text>
  <text class="tiny" x="196" y="334" text-anchor="middle">sized bag</text>
  <rect x="346" y="284" width="220" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text class="lab" x="456" y="314" text-anchor="middle">open_ended</text>
  <text class="tiny" x="456" y="334" text-anchor="middle">in-graph, unknown size</text>

  <path d="M196 354 L196 378" stroke="#64748b" stroke-width="2" marker-end="url(#k)"/>
  <path d="M456 354 L456 378" stroke="#64748b" stroke-width="2" marker-end="url(#k)"/>

  <rect x="86" y="382" width="220" height="56" rx="8" fill="#fff7ed" stroke="#d97706"/>
  <text class="tiny" x="196" y="406" text-anchor="middle">tokens unknown?</text>
  <text class="lab" x="196" y="426" text-anchor="middle">scout → commit</text>
  <rect x="346" y="382" width="220" height="56" rx="8" fill="#fff7ed" stroke="#d97706"/>
  <text class="tiny" x="456" y="406" text-anchor="middle">map thin?</text>
  <text class="lab" x="456" y="426" text-anchor="middle">scout → thorough</text>

  <path d="M196 438 L196 462" stroke="#64748b" stroke-width="2" marker-end="url(#k)"/>
  <path d="M456 438 L456 462" stroke="#64748b" stroke-width="2" marker-end="url(#k)"/>

  <rect x="86" y="466" width="220" height="56" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text class="tiny" x="196" y="490" text-anchor="middle">plan writable + tight SLA</text>
  <text class="lab" x="196" y="510" text-anchor="middle">fast_pass</text>
  <rect x="346" y="466" width="220" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text class="tiny" x="456" y="490" text-anchor="middle">loose SLA / need attributes</text>
  <text class="lab" x="456" y="510" text-anchor="middle">thorough</text>

  <text class="tiny" x="326" y="556" text-anchor="middle">Independent parts may share one pipeline (BP:6 set union).</text>
  <text class="tiny" x="326" y="574" text-anchor="middle">Ban unbound rediscovery, not all parallelism.</text>
  <text class="p" x="326" y="610" text-anchor="middle">Intent (QD) is step 1 — quality is often “List”.</text>
  <text class="tiny" x="326" y="630" text-anchor="middle">Gold books need expected_route, not only suffix prose.</text>
  <text class="tiny" x="326" y="662" text-anchor="middle">Weak QD makes every staple look like brute force.</text>

  <!-- RIGHT: clocks -->
  <rect x="640" y="88" width="564" height="640" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="922" y="122" text-anchor="middle">Across traffic · freeze a win</text>

  <rect x="672" y="148" width="500" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="lab" x="922" y="178" text-anchor="middle">Clock A · this turn</text>
  <text class="tiny" x="922" y="200" text-anchor="middle">QD → staple → retrieve vs shape (12 pin verbs)</text>
  <text class="tiny" x="922" y="218" text-anchor="middle">named_query / walk_path = other surfaces until wired</text>

  <path d="M922 236 L922 262" stroke="#64748b" stroke-width="2" marker-end="url(#k)"/>

  <rect x="672" y="266" width="500" height="200" rx="12" fill="#f0fdfa" stroke="#0d9488"/>
  <text class="lab" x="922" y="296" text-anchor="middle">Clock B · hot-path graduation</text>
  <text class="tiny" x="922" y="318" text-anchor="middle">Repeated style misses SLA → remember the staple’s plan</text>
  <rect x="700" y="336" width="444" height="36" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text class="tiny" x="922" y="358" text-anchor="middle">1. pipeline template (fast_pass / thorough)</text>
  <path d="M922 372 L922 388" stroke="#0d9488" stroke-width="2" marker-end="url(#k)"/>
  <rect x="700" y="390" width="444" height="36" rx="8" fill="#ffffff" stroke="#0d9488"/>
  <text class="tiny" x="922" y="412" text-anchor="middle">2. named_query HTTP  (not a catalog verb yet)</text>
  <text class="tiny" x="922" y="448" text-anchor="middle">prefer_named_query: true only after the tool exists</text>

  <rect x="672" y="488" width="500" height="120" rx="12" fill="#fff7ed" stroke="#d97706"/>
  <text class="lab" x="922" y="518" text-anchor="middle">Scorer must change first</text>
  <text class="tiny" x="922" y="540" text-anchor="middle">Today: hops&gt;1 / KindPipeline = S2 waste, fail_rate = nil</text>
  <text class="tiny" x="922" y="558" text-anchor="middle">Need: unbound retrievals, extra AI rounds, bind_ratio</text>
  <text class="tiny" x="922" y="576" text-anchor="middle">Until then, hot-path cannot “optimize slow common styles”</text>

  <rect x="672" y="628" width="500" height="72" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
  <text class="lab" x="922" y="656" text-anchor="middle">Cards must be rendered</text>
  <text class="tiny" x="922" y="676" text-anchor="middle">guidance JSON is stripped on the wire · suffix / hints inject</text>
  <text class="tiny" x="922" y="694" text-anchor="middle">hints.* not live until Client injects (ZC-WISH-040)</text>
</svg>
